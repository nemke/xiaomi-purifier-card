name: HACS validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dashboard repository
        uses: hacs/action@main
        with:
          category: plugin
          comment: false
